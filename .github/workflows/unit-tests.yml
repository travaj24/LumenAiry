name: Unit tests + lint

# v5.0 (audit_v4_13_1 + ROADMAP): fast PR feedback gate.  Runs the
# unit test suite (-m "not integration") plus ``ruff check`` on every
# PR.  Lighter than ``validate.yml`` (which exercises the full
# physics-validation suite via subprocess, ~3-5 minutes); this gate
# is the first-pass review signal for incoming changes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }}, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # v5.1.1: 3.10 is the documented floor (``requires-python``); exercise it.
        python-version: ['3.10', '3.11', '3.12', '3.13']
        # v5.23.0: SHARD the fast gate across 3 parallel JOBS (per version) via
        # pytest-split.  A single runner has only ~2-4 cores, so in-process xdist
        # capped the gate at ~1.5x (~44 -> 27 min); job-sharding puts each slice
        # on its OWN runner -> ~3x (~9-13 min/shard), the same lever that took the
        # slow gate 35 -> 14 min.  Each shard runs SERIALLY, so the timing/speedup
        # pins need no special handling.
        shard: [1, 2, 3]
    # v5.24.3: 25 -> 35.  The fast gate is now duration-BALANCED (complete
    # .test_durations regenerated to cover ALL fast files incl. test_fga's ~7min
    # -- previously the file only held the slow/eig timings, so the fast tests
    # split by COUNT and the heavy uncovered files piled onto one shard, tipping
    # it over the 20min step cap stochastically (v5.24.2's own merge timed out on
    # shard 3/3 x2 pythons; a later run on shard 1/3).  Balanced shards run
    # ~15min; the job cap gives headroom above the raised 30min step cap for
    # runner-speed variance and the occasional infra stall (a real hang still
    # exceeds it).
    timeout-minutes: 35

    steps:
      # v5.2.5 (AUDIT_V5_2_3 post-tag fix): fetch full history + tags
      # so the V16 walker (test_v5_2_3_walker_changelog_content.py)
      # can run ``git diff v5.1.0..v5.1.1`` against real tag refs.
      # Default checkout is shallow + tag-less; the v5.2.3-shipped
      # V16 synthetic-fabrication self-test (requires past tags
      # to be reachable for the diff command) was the only failing
      # test in the v5.2.3/v5.2.5 CI runs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # v5.0.1 fix #2 (post-PyPI): align with validate.yml's install
        # line (proven to work on 3.11-3.13).  The original ``[all,dev]``
        # install pulled jax + astropy + refractiveindex which were
        # adding non-trivial install time / memory pressure for no
        # unit-test benefit -- the validation suite (which validate.yml
        # exercises) is the canonical end-to-end harness for those
        # paths.  ``tomli`` is the 3.10 backport for the V11 dispatcher
        # walker; harmless on 3.11+.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fft,perf,numba,hdf5,zarr,dev]"
          pip install tomli

      - name: Library import sanity
        run: python -c "import lumenairy; print('lumenairy', lumenairy.__version__)"

      - name: Run unit tests (shard ${{ matrix.shard }}/3)
        # ``-p no:cacheprovider`` avoids writing the pytest cache to the readonly
        # CI filesystem layout.  Output tee'd to a file so the artifact upload
        # (next step) has something to surface on failure.
        shell: bash
        # v5.23.0: this shard runs ~1/3 of the fast gate SERIALLY on its own
        # runner (pytest-split --splits 3 --group).  Serial -> the timing/speedup
        # pins are unaffected and no per-file-state concerns.  ``.test_durations``
        # only carries the slow-test timings, so the fast tests split by count
        # here -- balanced enough for the fairly uniform fast suite; refine with a
        # fast-gate durations file later if a shard drifts.
        run: |
          python -m pytest tests/unit -m "not integration and not slow" --tb=short \
            -p no:cacheprovider --maxfail=5 -v \
            --splits 3 --group ${{ matrix.shard }} \
            --splitting-algorithm least_duration \
            --durations-path .test_durations 2>&1 \
            | tee unit_test_output.txt
          exit ${PIPESTATUS[0]}
        # v5.24.3: 20 -> 30 (balanced ~15min shards + headroom for infra stalls).
        timeout-minutes: 30

      - name: Upload unit-test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-output-py${{ matrix.python-version }}-shard${{ matrix.shard }}
          path: unit_test_output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Dump tail to job summary on failure
        if: failure()
        shell: bash
        run: |
          {
            echo "## Unit test output -- Python ${{ matrix.python-version }} (last 200 lines)"
            echo ""
            echo '```'
            tail -n 200 unit_test_output.txt || echo "(no output file)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Emit FAILED tests as annotations
        if: failure()
        shell: bash
        run: |
          # v5.1.1 (audit P2-NEW-V4-E): rationale for ``::error::``
          # over ``::warning::`` for the failure lines.  The
          # ``::warning::`` annotation type would surface in the
          # Annotations API but is rendered yellow in the GitHub UI
          # and does NOT add to the job-level failed-checks counter.
          # ``::error::`` is rendered red, contributes to the
          # public failed-checks count, and is the conventional
          # type for ``-grep "^FAILED"`` matches in pytest output.
          # The trailing ``tail -n 5`` summary line(s) (e.g.
          # ``5 failed, 1242 passed in 38.21s``) ARE
          # ``::warning::`` because they are diagnostic context,
          # not the failure itself -- duplicating each into
          # ``::error::`` would inflate the error count.
          # Annotations are visible via the public annotations API, so
          # external observers can see test failure names without
          # admin-level log access.  Print first 10 FAILED lines + any
          # ERROR lines + the final "X failed, Y passed" summary line.
          if [ -f unit_test_output.txt ]; then
            grep -E "^FAILED |^ERROR |error |Error:" unit_test_output.txt \
              | head -n 20 \
              | while IFS= read -r line; do
                  echo "::error::${line}"
                done
            # Final summary line(s) -- diagnostic context, not a
            # failure, so kept at ``::warning::`` (see comment above).
            tail -n 5 unit_test_output.txt | while IFS= read -r line; do
              echo "::warning::TAIL: ${line}"
            done
          else
            echo "::error::No unit_test_output.txt produced"
          fi

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    # v5.0.1 (audit P1-NEW-V4-1): lint job is advisory at v5.0; baseline
    # cleanup is a v5.1 work item alongside the file splits.  The job runs
    # and surfaces violations on PR, but does not block merge.  Real code
    # bugs (F821 forward-refs) were fixed in v5.0.1; the remaining 692
    # errors are cosmetic (I001 imports + F401 unused + F841 unused-var +
    # F541 empty f-string + E702 semicolons).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check lumenairy/ tests/unit/

  mypy:
    name: mypy strict (whitelist)
    runs-on: ubuntu-latest
    # v5.2 (AUDIT_V5_1_0 P2-NEW-F2-2 + ROADMAP v5.2 closure): wire the
    # ``[tool.mypy]`` strict-mode whitelist into CI as a real gate.  The
    # ``pyproject.toml`` ``files = [...]`` array drives which sources are
    # checked (lumenairy/backend, _deprecation.py, _context.py,
    # progress.py, memory.py); ``follow_imports = "silent"`` prevents
    # the ~1889-error cascade into untyped downstream files.  v5.1
    # closed the scope-local 63-error baseline; v5.2 makes the gate
    # enforce 0 errors going forward.  Unlike ``lint`` (continue-on-
    # error: true, advisory), this job blocks merge when the whitelist
    # regresses.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # Match the canonical CI install line from the unit job so the
        # type-stub surface (numpy, scipy, optional fft / numba / hdf5 /
        # zarr) matches what mypy resolves against in developer setups.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fft,perf,numba,hdf5,zarr,dev]"
          pip install mypy

      - name: mypy strict (pyproject whitelist)
        # No args: the ``[tool.mypy]`` ``files = [...]`` array in
        # pyproject.toml drives the checked surface.  Expand that list
        # as additional modules become type-clean.
        run: mypy

  public-api-smoke:
    name: Public API smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # v5.0.1 fix #2: align with the canonical CI install.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fft,perf,numba,hdf5,zarr,dev]"

      - name: Run public-API smoke
        run: python -m pytest tests/unit/test_public_api.py -v

  jax-unit:
    name: JAX unit tests (Python 3.12)
    runs-on: ubuntu-latest
    # v5.24.4 (AUDIT_V5_24_2 S4-4): the 4x3 fast ``unit`` matrix and every
    # other leg install WITHOUT jax (see the install-line note at line ~63 --
    # jax was deliberately dropped at v5.0.1 to keep the fast matrix light).
    # Consequently ALL jax-guarded unit files (module- or function-level
    # ``pytest.importorskip('jax')``) SKIP everywhere in CI -- including every
    # numpy<->jax parity gate and the P1 regression files -- so every JAX-side
    # finding is invisible to the gate.  This one dedicated, NON-matrix job
    # installs the ``jax`` extra and runs exactly the jax-guarded files so they
    # actually execute, WITHOUT re-bloating the 4x3 fast matrix (the documented
    # v5.0.1 reason jax was dropped there).  Regression-pinned by
    # tests/unit/test_v5_24_3_jax_ci_coverage.py.
    #
    # Cap is more generous than the 4x3 fast ``unit`` job (35) because this
    # is a SINGLE unsharded runner carrying the jax-guarded subset WITH jax
    # actually executing: jax's first-call XLA compilation is slow to warm
    # up (e.g. test_v5_10_3_rcwa_2d_autodiff.py alone ~3.5 min), and a lone
    # job can afford the headroom without bloating anything.  If CI shows
    # this approaching the cap, shard THIS job (mirror the unit/slow
    # ``pytest-split`` pattern) rather than adding jax back to the matrix.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          # Match the ``unit`` job: some audit files walk git history, and
          # full history + tags is cheap insurance against a walker in the
          # jax-guarded set.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies (with jax)
        # Same canonical install line as the ``unit`` job PLUS the ``jax``
        # extra (pyproject ``[project.optional-dependencies] jax``), so the
        # ``importorskip('jax')`` guards resolve and the tests run.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fft,perf,numba,hdf5,zarr,dev,jax]"

      - name: Library import sanity (jax present)
        run: |
          python -c "import jax; print('jax', jax.__version__)"
          python -c "import lumenairy; print('lumenairy', lumenairy.__version__)"

      - name: Run jax-guarded unit tests
        shell: bash
        env:
          # v5.24.4 (S4-4 completion): JAX and OpenBLAS in ONE process
          # deadlock on the first large *multi-threaded* ``numpy.linalg``
          # BLAS call -- e.g. the traced-lens Chebyshev-fit ``lstsq`` inside
          # ``apply_real_lens_traced`` (_lens_traced.py:558), reached by the
          # non-jax cookbook tests that share a file with a jax-guarded test.
          # JAX's runtime and OpenBLAS both spin up OpenMP pools; nested OpenMP
          # hangs the worker (SIGTERM 143), which is what killed this job.
          # Pinning BLAS to a single thread makes the numpy-side linear algebra
          # deadlock-free.  This does NOT slow the jax paths under test: JAX/XLA
          # parallelism is governed by XLA, not OMP_NUM_THREADS.
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        # Select every fast unit-test file that guards a jax path via
        # ``importorskip('jax')`` (module- or function-level).  Selecting by
        # the GUARD -- not by a ``-k jax`` name filter -- is name-independent,
        # so it also covers the module-level-jax files whose file/test names
        # lack "jax" (e.g. test_v5_10_3_rcwa_2d_autodiff.py) and the
        # numpy<->jax parity gate
        # test_v5_18_1_residuals.py::test_through_focus_stream_matches_fused,
        # both of which a ``-k jax`` selection silently drops.  ``-m "not
        # integration and not slow"`` keeps this single unsharded runner within
        # the step cap (the jax-guarded files are a subset of the fast gate).
        run: |
          mapfile -t jax_files < <(
            grep -rlE --include='*.py' "importorskip.{0,4}jax" tests/unit | sort
          )
          if [ "${#jax_files[@]}" -eq 0 ]; then
            echo "::error::No jax-guarded unit files found -- the S4-4 CI job has nothing to run; the selection grep or the test layout changed."
            exit 1
          fi
          echo "Running ${#jax_files[@]} jax-guarded unit files with jax installed:"
          printf '  %s\n' "${jax_files[@]}"
          # pytest-timeout converts any residual hang into a clean per-test
          # FAILURE (thread-dump) instead of a silent SIGTERM that kills the
          # whole job -- so one run reports the complete jax-leg status.
          pip install --quiet pytest-timeout
          # Deselect the traced-lens Zemax cookbook: it is a *numpy* end-to-end
          # example (already covered by the fast matrix), NOT a jax-parity test.
          # It is dragged in only because it shares a file (test_audit_misc.py)
          # with jax-guarded tests, and its multi-threaded BLAS lstsq
          # (apply_real_lens_traced's Chebyshev fit) deadlocks against JAX's
          # OpenMP runtime -- the deadlock C-code cannot be cleanly timed out.
          python -m pytest "${jax_files[@]}" -m "not integration and not slow" \
            --deselect "tests/unit/test_audit_misc.py::TestAuditFixesV4_12_0_round4_tier0_ReadmeCookbookExamples::test_real_lens_from_zemax_cookbook" \
            --timeout=200 --timeout-method=thread \
            --tb=short -p no:cacheprovider --maxfail=8 -v 2>&1 \
            | tee jax_unit_output.txt
          exit ${PIPESTATUS[0]}
        timeout-minutes: 45

      - name: Upload jax-unit log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jax-unit-output
          path: jax_unit_output.txt
          if-no-files-found: warn
          retention-days: 7

      # v5.30 (W6 CI): the c0073c2 jax-job failure produced ZERO
      # externally-visible detail -- exit 1 with no FAILED lines means an
      # ERROR-class outcome (collection/fixture/internal), and the log
      # artifact needs admin auth.  Mirror the matrix jobs' two
      # visibility steps so the next failure names itself via the public
      # annotations API.
      - name: Dump jax tail to job summary on failure
        if: failure()
        shell: bash
        run: |
          {
            echo "## JAX unit test output (last 200 lines)"
            echo ""
            echo '```'
            tail -n 200 jax_unit_output.txt || echo "(no output file)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Emit jax FAILED/ERROR lines as annotations
        if: failure()
        shell: bash
        run: |
          if [ -f jax_unit_output.txt ]; then
            grep -E "^FAILED |^ERROR |error |Error:|INTERNALERROR|Timeout" jax_unit_output.txt \
              | head -n 20 \
              | while IFS= read -r line; do
                  echo "::error::${line}"
                done
            tail -n 5 jax_unit_output.txt | while IFS= read -r line; do
              echo "::warning::TAIL: ${line}"
            done
          else
            echo "::error::No jax_unit_output.txt produced"
          fi

  slow-tests:
    name: Slow tests shard ${{ matrix.shard }}/3 (eig-heavy)
    runs-on: ubuntu-latest
    # v5.15.0: the graduated EME mode-solver convergence tests
    # (tests/unit/test_eme_*.py) and the RCWA FFF-NV slow test are eig-heavy
    # (~10-12 min on the runner).  They were excluded from the fast ``unit``
    # gate and run here on a single Python -- the numerics are not
    # version-sensitive.
    # v5.23.0: SHARD across 3 parallel jobs via pytest-split (balanced by the
    # committed .test_durations).  In-process xdist is UNSAFE here -- it would
    # scatter the BLAS-order-sensitive eig convergence tests across workers and
    # reintroduce the flake the single-thread pin suppresses -- so each shard
    # runs SERIALLY; only the file set differs.  ~45 min single job -> ~15 each.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # v5.24.3: 25 -> 35 (matches the raised 30min slow step cap + buffer).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fft,perf,numba,hdf5,zarr,dev]"

      - name: Run slow tests (shard ${{ matrix.shard }}/3)
        shell: bash
        # v5.18.1: pin BLAS to a single thread.  The eig-heavy EME vector
        # convergence tests (test_eme_2d_vector) resolve near-threshold modes
        # from an ill-conditioned cascade generator whose svdvals are sensitive
        # to multi-threaded BLAS reduction order -- run-to-run the recovered
        # mode count wobbled enough to flip the completeness/convergence
        # assertions (byte-identical code passed one run, failed the next).
        # Single-threaded BLAS makes the reductions deterministic per runner,
        # removing the dominant flake source.  (These remain hardware-sensitive
        # convergence tests; single-threading is a mitigation, not a proof.)
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          VECLIB_MAXIMUM_THREADS: '1'
        run: |
          # pytest-split --splits/--group distributes the slow tests across the
          # 3 shard jobs, balanced by the committed .test_durations; each shard
          # runs its subset serially.
          python -m pytest tests/unit -m "slow and not integration" --tb=short \
            -p no:cacheprovider -v \
            --splits 3 --group ${{ matrix.shard }} \
            --splitting-algorithm least_duration \
            --durations-path .test_durations 2>&1 \
            | tee slow_test_output.txt
          exit ${PIPESTATUS[0]}
        # v5.24.3: 20 -> 30 (headroom for the eig-heavy shards + infra stalls).
        timeout-minutes: 30

      - name: Upload slow-test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slow-test-output-shard${{ matrix.shard }}
          path: slow_test_output.txt
          if-no-files-found: warn
          retention-days: 7
