name: Unit tests + lint

# v5.0 (audit_v4_13_1 + ROADMAP): fast PR feedback gate.  Runs the
# unit test suite (-m "not integration") plus ``ruff check`` on every
# PR.  Lighter than ``validate.yml`` (which exercises the full
# physics-validation suite via subprocess, ~3-5 minutes); this gate
# is the first-pass review signal for incoming changes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # v5.0.1 fix: the v5.0 workflow installed ``[all]`` which omits
        # ``pytest`` (lives in the ``[dev]`` extras group), so pytest
        # itself wasn't available -- every test job failed at the
        # ``python -m pytest`` invocation.  ``[all,dev]`` is the
        # canonical CI install.  ``tomli`` is the 3.10 backport for
        # the V11 dispatcher-pin walker (3.11+ has tomllib in stdlib).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
          pip install tomli

      - name: Run unit tests
        run: |
          python -m pytest tests/unit -m "not integration" -q --tb=short

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    # v5.0.1 (audit P1-NEW-V4-1): lint job is advisory at v5.0; baseline
    # cleanup is a v5.1 work item alongside the file splits.  The job runs
    # and surfaces violations on PR, but does not block merge.  Real code
    # bugs (F821 forward-refs) were fixed in v5.0.1; the remaining 692
    # errors are cosmetic (I001 imports + F401 unused + F841 unused-var +
    # F541 empty f-string + E702 semicolons).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check lumenairy/ tests/unit/

  public-api-smoke:
    name: Public API smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # v5.0.1 fix: ``[all]`` omits pytest; switch to ``[all,dev]``.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Run public-API smoke
        run: python -m pytest tests/unit/test_public_api.py -v
