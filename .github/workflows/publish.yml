name: Publish to PyPI

# Auto-publish to PyPI when a GitHub Release is published.
#
# Authentication uses PyPI Trusted Publishing (OIDC) -- NO secret tokens.
# Before this workflow can succeed, the project owner must register this
# repository as a trusted publisher at:
#
#     https://pypi.org/manage/project/lumenairy/settings/publishing/
#
# Settings to enter:
#   PyPI Project Name :  lumenairy
#   Owner             :  travaj24
#   Repository name   :  LumenAiry
#   Workflow name     :  publish.yml
#   Environment name  :  pypi
#
# (The environment name below MUST match the one entered above.)

on:
  release:
    types: [published]
  # Allow manual re-runs from the Actions tab if a release upload fails part-way.
  workflow_dispatch:

jobs:
  # v5.1.1 (audit P1-NEW-3WAY-1): release-process gate.  v5.0.0,
  # v5.0.1, and v5.1.0 all shipped to PyPI before the unit-tests
  # workflow was ever observed green on the tag's source -- v5.0.0
  # audit V4 read the workflow YAML but didn't trigger it;
  # ``publish.yml`` had no dependency on CI passing.  v5.1.0's
  # CHANGELOG claimed to close this but the actual code change was
  # lost in the parallel-edit race during the 6 file splits.
  # v5.1.1 actually wires it: this pre-build ``verify`` job runs the
  # unit suite + library-import sanity on the tag's source so a
  # release on broken CI cannot upload to PyPI.  ``build`` depends
  # on ``verify``; ``publish`` depends on both.
  verify:
    name: Verify CI on release tag
    runs-on: ubuntu-latest
    # v5.12.0: bumped 20 -> 30 to match unit-tests.yml.  v5.20.0: bumped 30 -> 40
    # to STAY in sync with unit-tests.yml (job 40 / step 33) after the fast suite
    # drifted to ~25 min -- the exact contradiction this comment warns about
    # happened: unit-tests.yml passed at the new cap but this verify gate, still
    # at 25, timed out the v5.20.0 publish.  Keep them equal.
    # v5.21.0: 40 -> 47 (step 33 -> 40), again in sync with unit-tests.yml after
    # the v5.21 test batches pushed the fast gate past 33 min.
    timeout-minutes: 47
    strategy:
      fail-fast: true
      matrix:
        # v5.2.5 (AUDIT_V5_2_3 P2-F1-4): added '3.10' to the verify
        # matrix.  Until v5.2.5 the verify gate exercised 3.11-3.13
        # only -- which left a hole at the documented floor (3.10).
        # v5.2.2's whole reason for existing was 3.10 install-path
        # drift (pyfftw 0.15.1 + zarr 3.x dropped 3.10 support); the
        # ship gate could not see that failure mode because 3.10 was
        # not in this matrix.  unit-tests.yml already exercises 3.10
        # so this brings publish.yml's matrix into parity.
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      # v5.2.5: fetch full history + tags so the V16
      # verify_changelog_closures step below can resolve PREV_TAG
      # via ``git diff PREV_TAG..HEAD``.  Default checkout is
      # shallow + tag-less, which would cause V16 to silently exit
      # rc=2 ("no diff range resolvable") on every release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Lumenairy with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fft,perf,numba,hdf5,zarr,dev]"
          pip install tomli

      # v5.3.2 (ROADMAP V18 walker -- source-file:line citation
      # drift).  V12 catches FILE-LEVEL fabrications (cited file
      # does not exist).  V16 (below) catches CONTENT-LEVEL
      # fabrications (cited file exists but is not in
      # ``git diff PREV_TAG..HEAD``).  V18 closes a third sibling:
      # LINE-LEVEL drift in source-file:line citations.  The v5.3.0
      # ship hit this exact class -- CHANGELOG cited
      # ``optimize/wrapper_merits.py:855`` but the v5.3.0 JIT change
      # had shifted the sentinel branch to line 876.  V18 reads the
      # cited line, asserts it is non-trivial (not whitespace, not a
      # closing bracket, not a bare ``pass``/``continue``/``break``).
      # Runs BEFORE the V16 step so line-level drift is surfaced
      # before content-level drift.  Exit codes: 0 = OK, 1 = drift
      # detected (fail the job), 2 = clean skip (no source-file:line
      # citations in the topmost block, e.g. a docs-only patch).  We
      # accept 0 and 2 as pass; 1 fails the job.
      - name: Verify CHANGELOG source-line citations
        # ``shell: bash {0}`` overrides the default ``bash --noprofile
        # --norc -eo pipefail {0}``, removing ``-e`` so a non-zero exit
        # from ``check_source_line_citations.py`` (rc=2 on a docs-only
        # or horizon-items release with no source-file:line citations)
        # does NOT terminate the step before the rc capture below.
        # v5.3.2's v5.3.2-tag publish run failed because the default
        # errexit semantics killed the step on the script's clean-skip
        # exit (rc=2) before the if-branch could translate it to 0.
        shell: bash {0}
        run: |
          python scripts/check_source_line_citations.py
          rc=$?
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]; then
            echo "check_source_line_citations: OK (rc=$rc)"
          else
            echo "::error::check_source_line_citations failed (rc=$rc) -- source-file:line citation drift in CHANGELOG.  See script output above."
            exit "$rc"
          fi

      # v5.2.3 (AUDIT_V5_1_0 P1-NEW-2WAY-1; CONTENT-LEVEL CHANGELOG-
      # fabrication walker V16 + companion script).  V12 catches
      # FILE-LEVEL fabrications (cited file does not exist); V16 +
      # this script catch CONTENT-LEVEL fabrications (cited file
      # exists but is not in the ``git diff PREV_TAG..HEAD``
      # changeset -- the v5.1.0 ``publish.yml verify gate`` claim
      # was that exact class).  Runs BEFORE the library-import
      # sanity step so a release with fabricated audit-closure
      # claims fails BEFORE upload.  Exit codes: 0 = OK, 1 =
      # fabrication candidates found (fail the job), 2 = clean
      # skip (no audit closures or no git history), 3 = input
      # error.  We accept 0 and 2 as pass; 1 and 3 fail the job.
      - name: Verify CHANGELOG closures have backing diffs
        # ``shell: bash {0}`` removes the default ``-e`` so rc=2 (clean
        # skip on a release with no audit-closure bullets) does not
        # terminate the step.  Same latent bug class as the V18 step
        # above; surfaced first by v5.3.2 where both walkers returned
        # rc=2 simultaneously.
        shell: bash {0}
        run: |
          python scripts/verify_changelog_closures.py
          rc=$?
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]; then
            echo "verify_changelog_closures: OK (rc=$rc)"
          else
            echo "::error::verify_changelog_closures failed (rc=$rc) -- fabrication candidates in CHANGELOG.  See script output above."
            exit "$rc"
          fi

      - name: Library import sanity
        run: python -c "import lumenairy; print('lumenairy', lumenairy.__version__)"

      - name: Run unit tests (release tag verification)
        # v5.23.0: mirror unit-tests.yml -- xdist parallel bulk + serial timing
        # pins, BLAS pinned to one thread per worker.
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          VECLIB_MAXIMUM_THREADS: '1'
        shell: bash
        run: |
          # ``set +e``: disable errexit so both pytest invocations run and their
          # return codes are combined (see unit-tests.yml for the rationale).
          set +e
          # v5.15.0: ``slow`` runs in the unit-tests sharded slow job; excluded
          # here.  Timing/speedup pins run serially (xdist contention skews them).
          TIMING="test_decompose_lg_cache_speedup or test_doublet_trace_at_least_1_3x_faster or test_warm_call_at_least_200x_faster_than_first or test_warm_call_at_least_10x_faster_than_first or test_modal_asymptotic_perf_win or test_numba_jit_speedup_on_large_grid"
          python -m pytest tests/unit -m "not integration and not slow" --tb=short \
            -p no:cacheprovider -n auto --dist loadfile --maxfail=8 -k "not ($TIMING)"
          rc_bulk=$?
          python -m pytest tests/unit -m "not integration and not slow" --tb=short \
            -p no:cacheprovider -k "$TIMING"
          rc_timing=$?
          [ "$rc_bulk" -eq 0 ] && [ "$rc_timing" -eq 0 ]
        # v5.23.0: 40 -> 35 (xdist parallelises the fast gate; was ~40 min serial).
        timeout-minutes: 35

  build:
    name: Build sdist + wheel
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload artifacts for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [verify, build]
    runs-on: ubuntu-latest
    # The "pypi" environment is what PyPI's Trusted Publishing config
    # checks for -- requests from any other environment will be rejected.
    environment:
      name: pypi
      url: https://pypi.org/project/lumenairy/
    permissions:
      id-token: write   # required by pypa/gh-action-pypi-publish for OIDC
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `with: password:` -- Trusted Publishing handles auth via OIDC.
