name: Publish to PyPI

# Auto-publish to PyPI when a GitHub Release is published.
#
# Authentication uses PyPI Trusted Publishing (OIDC) -- NO secret tokens.
# Before this workflow can succeed, the project owner must register this
# repository as a trusted publisher at:
#
#     https://pypi.org/manage/project/lumenairy/settings/publishing/
#
# Settings to enter:
#   PyPI Project Name :  lumenairy
#   Owner             :  travaj24
#   Repository name   :  LumenAiry
#   Workflow name     :  publish.yml
#   Environment name  :  pypi
#
# (The environment name below MUST match the one entered above.)

on:
  release:
    types: [published]
  # Allow manual re-runs from the Actions tab if a release upload fails part-way.
  workflow_dispatch:

jobs:
  # v5.1.1 (audit P1-NEW-3WAY-1): release-process gate.  v5.0.0,
  # v5.0.1, and v5.1.0 all shipped to PyPI before the unit-tests
  # workflow was ever observed green on the tag's source -- v5.0.0
  # audit V4 read the workflow YAML but didn't trigger it;
  # ``publish.yml`` had no dependency on CI passing.  v5.1.0's
  # CHANGELOG claimed to close this but the actual code change was
  # lost in the parallel-edit race during the 6 file splits.
  # v5.1.1 actually wires it: this pre-build ``verify`` job runs the
  # unit suite + library-import sanity on the tag's source so a
  # release on broken CI cannot upload to PyPI.  ``build`` depends
  # on ``verify``; ``publish`` depends on both.
  verify:
    name: Verify CI on release tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Lumenairy with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fft,perf,numba,hdf5,zarr,dev]"
          pip install tomli

      # v5.2.3 (AUDIT_V5_1_0 P1-NEW-2WAY-1; CONTENT-LEVEL CHANGELOG-
      # fabrication walker V16 + companion script).  V12 catches
      # FILE-LEVEL fabrications (cited file does not exist); V16 +
      # this script catch CONTENT-LEVEL fabrications (cited file
      # exists but is not in the ``git diff PREV_TAG..HEAD``
      # changeset -- the v5.1.0 ``publish.yml verify gate`` claim
      # was that exact class).  Runs BEFORE the library-import
      # sanity step so a release with fabricated audit-closure
      # claims fails BEFORE upload.  Exit codes: 0 = OK, 1 =
      # fabrication candidates found (fail the job), 2 = clean
      # skip (no audit closures or no git history), 3 = input
      # error.  We accept 0 and 2 as pass; 1 and 3 fail the job.
      - name: Verify CHANGELOG closures have backing diffs
        run: |
          python scripts/verify_changelog_closures.py
          rc=$?
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]; then
            echo "verify_changelog_closures: OK (rc=$rc)"
          else
            echo "::error::verify_changelog_closures failed (rc=$rc) -- fabrication candidates in CHANGELOG.  See script output above."
            exit "$rc"
          fi

      - name: Library import sanity
        run: python -c "import lumenairy; print('lumenairy', lumenairy.__version__)"

      - name: Run unit tests (release tag verification)
        run: |
          python -m pytest tests/unit -m "not integration" --tb=short \
            -p no:cacheprovider --maxfail=5
        timeout-minutes: 15

  build:
    name: Build sdist + wheel
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload artifacts for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [verify, build]
    runs-on: ubuntu-latest
    # The "pypi" environment is what PyPI's Trusted Publishing config
    # checks for -- requests from any other environment will be rejected.
    environment:
      name: pypi
      url: https://pypi.org/project/lumenairy/
    permissions:
      id-token: write   # required by pypa/gh-action-pypi-publish for OIDC
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `with: password:` -- Trusted Publishing handles auth via OIDC.
