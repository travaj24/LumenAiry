[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumenairy"
version = "5.46.0"
description = "Coherent optical beam propagation, geometric ray tracing, and manipulation using the Angular Spectrum Method."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Andrew Traverso" },
]
keywords = [
    "optics",
    "physics",
    "propagation",
    "angular-spectrum-method",
    "diffraction",
    "fourier-optics",
    "wave-optics",
    "ray-tracing",
    "photonics",
    "metasurface",
    "polarization",
    "zemax",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    # 3.14 is the interpreter this library is developed and hand-tested on,
    # and (since the 2026-09-11 audit, V4) a real CI leg: ``unit-tests.yml``
    # runs the matrix on 3.10-3.14.  The accelerator wheels the old comment
    # here said were missing all exist and are installed on the dev box --
    # MEASURED 2026-09-12: numba 0.65.1, jax 0.10.1, pyfftw 0.15.1 on
    # CPython 3.14.6.  The one optional group that is NOT exercised on 3.14
    # in CI is ``jax``: the dedicated jax leg pins 3.12 because the declared
    # ``jax>=0.11`` floor is what that leg gates (see the ``jax`` extra).
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# v5.38 -- NUMPY 2 IS THE FLOOR.  ``numpy>=1.20`` had stopped describing
# anything the project is tested, measured or written against:
#
# * every CI leg, every local mount and every measured envelope in the test
#   suite runs numpy 2.x (2.2.6 / 2.4.4 / 2.4.6 / 2.5.1).  Nothing has been
#   run against 1.x in years, so the old floor was an untested claim;
# * the repo already calls numpy-2-only API with no fallback anywhere --
#   ``np.trapezoid`` (added in 2.0; ``np.trapz`` was REMOVED in 2.0) in the
#   ``validation/oracles`` truths, which are the reference the accuracy
#   campaigns are graded against;
# * the library's own dtype reasoning is written AGAINST NEP-50 weak-scalar
#   promotion, not around it: the tangent-facet / banded-halo screens in
#   ``elements/_lens_real.py`` cite the NEP-50 rule by name to justify their
#   Python-float casts, with a measured 5e-6 field divergence when the rule is
#   violated.  Under 1.x value-based casting that reasoning does not describe
#   the arithmetic being performed.
#
# scipy>=1.13 is the matching floor, adjudicated rather than guessed: 1.13.0
# is the first SciPy line built against the numpy 2.0 ABI (earlier lines are
# compiled against the 1.x C-API and abort at import under numpy 2), so any
# scipy < 1.13 is un-installable with this numpy floor.  1.13 supports
# Python >= 3.9 and numpy 2.0 supports >= 3.9, so the pair is consistent with
# ``requires-python = ">=3.10"`` (on 3.10 the resolver lands on the numpy
# 2.0-2.2 lines, which still ship 3.10 wheels).
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.5",
    "psutil>=5.0",
    # threadpoolctl is what makes ``set_blas_threads`` / ``rcwa_blas_threads``
    # / the ``@_with_blas_limit`` wrapper on every public RCWA entry point
    # ACTUALLY apply a cap.  Without it they are inert (they warn and pass
    # through), and on an oversubscribed many-core box that is catastrophic,
    # not a micro-optimisation: MEASURED on a 24-thread Windows OpenBLAS
    # 0.3.31 build, ``inv()`` of a 163x163 complex matrix takes 2.29 s
    # unpinned against 0.0057 s at one thread (400x), and a 1-D TM RCWA solve
    # at n_orders=81 takes 18.2 s instead of 0.13 s (140x).  It is tiny and
    # pure Python (and is already a transitive dependency of scikit-learn, so
    # most environments have it), so the library's own remedy has to work out
    # of the box.  Floor 3.1: ``ThreadpoolController`` -- the cached
    # enumeration path ``rcwa/_core.py::_get_blas_controller`` prefers --
    # landed in 3.0, and 3.1 is the first release with the Windows OpenBLAS
    # 0.3.x detection this box needs.  ``_core.py`` degrades to the legacy
    # ``threadpool_limits`` and then to a no-op, so nothing breaks below it.
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
# v5.2.2: pyfftw 0.15.1 (released 2025) bumped its
# ``requires-python`` to ``>=3.11`` while pyfftw 0.15.0 still
# supports 3.10.  pip's resolver picks 0.15.1 on 3.10 and fails the
# install entirely; cap to ``<0.15.1`` on 3.10 so 3.10 users still
# get pyfftw (last 3.10-compatible release).
fft = [
    'pyfftw>=0.13,<0.15.1; python_version < "3.11"',
    'pyfftw>=0.13; python_version >= "3.11"',
]
gpu = ["cupy>=14.0"]  # cupy.linalg.eig (cuSOLVER geev) exists only since v14
fits = ["astropy>=5.0"]
# v4.16.1 (audit M-1): refractiveindex pulled from the hard
# dependency block to align with the optional / lazy-import handling
# in ``lumenairy/glass.py``.  When this group is NOT installed the
# library transparently falls back to bundled Sellmeier coefficients
# in ``SELLMEIER_COEFFICIENTS`` for the common catalog entries; only
# tuple-style ``(shelf, book, page)`` glasses without a bundled
# Sellmeier raise a clear ImportError on first lookup.
glass = ["refractiveindex>=1.0"]
# v4.16.0: filelock is required for cross-process atomic append in
# lumenairy/io/storage.py (Agent B scope).  Filelock is a tiny pure-
# Python package (~10 KB) and is NOT a transitive dep of h5py or zarr
# (verified against h5py 3.16.0 / zarr 3.1.6), so we add it
# explicitly here.
hdf5 = ["h5py>=3.0", "filelock>=3.0"]
# v4.16.1 (audit M-3): bumped from ``zarr>=2.14`` to ``zarr>=3.0``.
# ``lumenairy/io/storage.py`` uses ``Group.create_array``, a Zarr-v3
# API.  Users pinning ``zarr==2.x`` hit ``AttributeError`` on the
# Group object; bumping the floor matches the actual API in use.
#
# v5.2.2: zarr>=3.0 itself ``requires-python = ">=3.11"`` (zarr 3.1.6
# confirmed via PyPI metadata).  ``pip install lumenairy[zarr]`` on
# Python 3.10 (the library's documented floor) hits a resolver
# conflict and fails the install entirely -- which broke the v5.1.1
# re-added 3.10 CI matrix entry.  PEP 508 environment marker pins
# the zarr line to Python >= 3.11 so the 3.10 install path
# resolves; tests requiring zarr v3 already skip cleanly when
# zarr is missing (per the v4.16.0 per-test pattern at
# ``test_v4_16_0_agent_b_multiprocess_storage.py:142-159``; the
# v5.2.2 inline comment originally cited a non-existent "conftest"
# pattern -- ``tests/conftest.py`` has no zarr handling.  v5.3
# (AUDIT_V5_2_5 V6 closure) corrects the citation).  ``filelock``
# stays unconditional so the storage-lock contract is exercisable
# on 3.10 (against h5py only) too.
zarr = ['zarr>=3.0; python_version >= "3.11"', "filelock>=3.0"]
# JAX (CPU): enables automatic differentiation of any function written
# against the array-namespace dispatch (lumenairy.backend), JIT
# compilation via XLA, and free GPU/TPU acceleration if the user
# installs jax[cuda] / jax[tpu] separately.
# v5.24.4: floor raised to jax>=0.11 -- the supported baseline going
# forward (the S4-4 CI leg runs the jax-guarded suite on 0.11; the
# canonical-poly fit's differentiable solve and the pmm-2d jnp/np parity
# bars are validated against it).
#
# 2026-09-12 (audit V4/P1-6) -- DECISION, recorded because the two sides
# disagree.  The dev box runs jax 0.10.1 on CPython 3.14, i.e. BELOW this
# declared floor, while the ``jax-unit`` CI leg resolves 0.11 on 3.12.  The
# floor STAYS at 0.11: it is the version every jax-guarded gate in the suite
# is measured against, and lowering it would declare support for a line no
# leg exercises.  What changes instead is that the CI leg now ASSERTS the
# resolved jax satisfies this floor (``unit-tests.yml``, "Library import
# sanity (jax present)"), so the declared floor and the gated version can no
# longer drift apart silently.  The local 0.10.1 is therefore knowingly
# below-floor: jax results measured on this box are advisory, and the gate of
# record is the CI leg.  Raising the dev box to >= 0.11 is a follow-up (it
# changes numerics for every concurrent audit work package, so it is not a
# mid-campaign action).
# v5.42.1 (dep-metadata drift, 2026-08-24): jax 0.11.x itself requires
# Python >=3.12 (last 3.11-compatible jax is 0.10.2, last 3.10 is 0.6.2),
# so an unmarked ``jax>=0.11.0`` makes ``lumenairy[jax]`` UNRESOLVABLE on
# 3.10/3.11.  Same env-marker shape as the v5.2.2 zarr fix: below 3.12 the
# extra installs nothing rather than an untested older jax (0.11 is the
# only baseline the S4-4 CI leg -- a dedicated Python 3.12 job -- gates).
jax = ['jax>=0.11.0; python_version >= "3.12"']
# JAX with CUDA wheels.  User is responsible for ensuring a compatible
# CUDA / cuDNN install is on the system.
jax-gpu = ['jax[cuda12]>=0.11.0; python_version >= "3.12"']
# numexpr fuses the ``E * exp(-1j*k0*opd)`` phase-screen multiply in
# ``apply_real_lens``, ~1.7x faster at large N and substantially
# lower peak memory (no complex128 NxN intermediates).  Optional --
# library falls back to numpy when missing.
perf = ["numexpr>=2.8"]
# Numba JIT for the aspheric-coefficient sum and the Maslov Chebyshev
# evaluator.  Library falls back to NumPy paths when missing.
numba = ["numba>=0.58"]
# v4.16 (ROADMAP #11): pymoo wraps NSGA-II for multi-objective Pareto
# optimisation in ``lumenairy.optimize.multi_objective``.  Strictly
# opt-in: the wrapper module imports without pymoo (so users can
# discover the function via tab-complete / docs), and only the actual
# ``design_optimize_multi_objective(...)`` call raises ImportError if
# pymoo is missing.  pymoo's transitive deps (autograd, deap, cma)
# are heavier than the existing optional groups, so it is NOT bundled
# into the ``all`` group below.
multi_objective = ["pymoo>=0.6"]
# LumenAiry Designer GUI: PySide6 + 3D viewer + storage backend.
gui = [
    "PySide6>=6.5",
    "pyvista>=0.40",
    "pyvistaqt>=0.9",
    "h5py>=3.0",
]
all = [
    # v5.2.2: same env-marker split as the standalone ``fft`` extras
    # group -- pyfftw 0.15.1+ requires Python 3.11+.
    'pyfftw>=0.13,<0.15.1; python_version < "3.11"',
    'pyfftw>=0.13; python_version >= "3.11"',
    "numexpr>=2.8",
    "numba>=0.58",
    "astropy>=5.0",
    "h5py>=3.0",
    # v4.16.1 (audit M-3): aligned with the standalone ``zarr`` extras
    # group: floor bumped to Zarr v3 (Group.create_array API).
    # v5.2.2: zarr v3 requires Python 3.11+; env marker skips it on
    # 3.10 (storage-zarr tests skip on 3.10 in that case).
    'zarr>=3.0; python_version >= "3.11"',
    # v5.42.1: same marker as the standalone ``jax`` group -- jax 0.11.x
    # requires Python >=3.12 (jax-guarded tests importorskip below it).
    'jax>=0.11.0; python_version >= "3.12"',
    "filelock>=3.0",
    # v4.16.1 (audit M-1): refractiveindex bundled into ``all`` so the
    # one-shot ``pip install lumenairy[all]`` continues to pull it
    # along with every other optional accelerator.
    "refractiveindex>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-benchmark>=4.0",
    "pytest-xdist>=3.0",
    "pytest-split>=0.8",
]

[project.urls]
Homepage = "https://github.com/travaj24/LumenAiry"
Documentation = "https://github.com/travaj24/LumenAiry/wiki"
Repository = "https://github.com/travaj24/LumenAiry.git"
Issues = "https://github.com/travaj24/LumenAiry/issues"
Changelog = "https://github.com/travaj24/LumenAiry/blob/main/CHANGELOG.md"
Releases = "https://github.com/travaj24/LumenAiry/releases"

[project.scripts]
lumenairy-designer = "lumenairy.ui.main_window:_cli_main"

# Auto-discover sub-packages (lumenairy + lumenairy.ui) instead of
# hand-listing each.  ``find:`` requires the include glob so we don't
# accidentally pick up other top-level dirs.
[tool.setuptools.packages.find]
include = ["lumenairy*"]

[tool.setuptools.package-data]
lumenairy = ["*.md", "*.txt", "*.html", "py.typed"]

[tool.pytest.ini_options]
# Two-layer test suite (4.3.0+):
#
#   tests/unit/        -- the library's own gate: contract tests, physics
#                          oracles and regression pins; no external deps;
#                          default target on a fresh checkout.  NOT fast in
#                          aggregate -- MEASURED 2026-09-12 from the committed
#                          ``.test_durations``: 14 666 collected ids,
#                          13 061 s = 3.63 h of timed work.  It is split into
#                          two CI lanes by the ``slow`` marker (see below);
#                          neither lane is a "<30 s" target and no such
#                          contract exists.  The old "fast (<30s)" wording
#                          here was wrong by ~440x (audit 2026-09-11, V5).
#   tests/integration/ -- pytest wrapper around validation/, runs each
#                          validation/<dir>/test_*.py as a subprocess
#                          for full physics validation (~30 min).
#
# Mark integration tests with @pytest.mark.integration so they can
# be opted-in (``-m integration``) or skipped (``-m "not integration"``).
# The default invocation runs unit + (un-marked) tests and skips the
# integration suite for fast dev feedback.
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
# Allow pytest to discover both the canonical ``test_*`` naming and
# the legacy ``t_*`` naming used throughout the ``validation/`` suite
# (the latter is wrapped by ``validation/conftest.py`` so its
# ``(bool, str)`` returns are converted into real assertions).
python_functions = ["test_*", "t_*"]
# Marker inventory, MEASURED 2026-09-12 (audit 2026-09-11, V5) so the
# declared set describes what is actually applied:
#   slow         54 files (19 module-level) before this change, 65 after;
#                it is the ONLY marker that selects a CI lane.
#   integration   3 applications (``tests/integration/``), excluded by
#                ``addopts`` and opted in with ``-m integration``.
#   unit / regression / bench   0 applications each.  They are kept as
#                DECLARED-BUT-UNUSED on purpose: ``--strict-markers`` is on,
#                so removing them turns any future ``@pytest.mark.unit`` into
#                a collection error rather than a silent no-op, and ``bench``
#                is the name ``benchmarks/`` will use when it is gated.
markers = [
    "unit: API-contract test, no external deps (declared; 0 applications)",
    "integration: full validation suite via subprocess (~30 min)",
    "regression: tests guarding against specific historical bugs (declared; 0 applications)",
    "slow: >= 2 min of file-total runtime -- runs in the sharded slow CI lane, not the fast matrix",
    "bench: pytest-benchmark micro-perf tests (run with --benchmark-only; declared, 0 applications -- benchmarks/ is ungated)",
]
# v5.24.x (audit S5-12): explicit warnings policy.  Previously there was
# NO ``filterwarnings`` config, so a warning emitted mid-test could pass
# silently.  A blanket ``error`` is deliberately NOT used: several physics
# diagnostics legitimately fire in the green suite (e.g. the PMM
# near-singular ``energy not conserved`` UserWarning), and erroring on
# every UserWarning would convert genuine diagnostics into false failures.
# Instead we surface everything (``default``) and promote the
# always-a-bug, DETERMINISTIC categories to errors:
#   * PytestReturnNotNoneWarning -- a test that ``return``s instead of
#     ``assert``ing silently "passes"; that footgun is exactly what the
#     S5-12 finding flags.  (validation ``t_*`` functions are exempt --
#     ``validation/conftest.py`` consumes their return value in a
#     ``pytest_pyfunc_call`` hook that returns True.)
#   * SyntaxWarning -- always a real source defect.
filterwarnings = [
    "default",
    "error::pytest.PytestReturnNotNoneWarning",
    "error::SyntaxWarning",
]
# v5.24.x (audit S5-12): make ``xfail`` strict by default so a test
# marked xfail that starts PASSING (a closed sibling-gap / dead xfail
# scaffolding) FAILS loudly -- forcing removal of the stale marker --
# instead of silently reporting XPASS.  Audited safe: every applied
# xfail marker in the suite is already ``strict=True`` or is an
# imperative ``pytest.xfail()`` (unaffected by this default), and the
# one conditional ``pytest.mark.xfail`` site currently applies zero
# markers (all parametrize variants are ``pinned``).
xfail_strict = true
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m", "not integration",
]

# v5.0: ruff lint configuration -- minimal first-pass adoption.  Heavier
# rule sets (PT, RET, SIM, etc.) come in v5.1 once the existing code
# has been swept clean of the v5.0 baseline issues.
[tool.ruff]
line-length = 100
target-version = "py310"
# 2026-09-12 (audit 2026-09-11, V4/P1-3): ``lumenairy/ui/`` is no longer
# excluded.  Excluding it removed ~30 modules -- including the 3 626-line
# ``main_window.py`` -- from the only always-on static gate, so an undefined
# name in the GUI could not be caught by anything.  It is scoped back in with
# a per-directory ignore list (see ``[tool.ruff.lint.per-file-ignores]``)
# rather than wholesale: the cosmetic rules the GUI trips are silenced, the
# rules that catch real bugs (F821 undefined name, F632 identity-vs-literal,
# E711/E712/E713, E722 bare except, ...) are ENFORCED there from now on.
extend-exclude = [
    "validation/",
    "docs/",
    "examples/",
]

[tool.ruff.lint]
# Conservative initial rule set: errors only (E), pyflakes (F), import
# sorting (I).  No style nits at v5.0 to keep the diff manageable;
# additional categories opt in per-module via per-file-ignores.
select = ["E", "F", "I"]
ignore = [
    "E501",  # line too long: many legitimate long-string fail-message lines
    "E741",  # ambiguous variable name: physics symbols (l, I, O) collide
    "E402",  # module-level import not at top: lazy imports + try-import-as
]

[tool.ruff.lint.isort]
# Aliased re-exports (``from ._lens_real import apply_real_lens as apply_real_lens``)
# share one statement per source module instead of one statement per name; the
# explicit ``name as name`` form is what marks a re-export for type checkers, and
# without combining, a module such as ``elements/lenses.py`` needs one statement
# per exported name.  Comment blocks stay attached to the first statement of each
# group.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# (``tests/**/*.py``, ``lumenairy/__init__.py`` and the four sub-package
# re-export hubs that also need I001 are declared once, in the 2026-09-12
# block at the bottom of this table -- TOML forbids a duplicate key.)
# v5.2 (audit P3-NEW post-v5.1.0-split closure): the 6 file-split shells
# do ``from .X import Y`` purely to re-export pre-v5.1.0 public symbols.
# Without this ignore, ``ruff --fix`` removes the unused imports and
# breaks every external ``from lumenairy.propagators.propagation import Y``
# call site that pre-v5.1.0 worked.  V13 walker (shell-vs-canonical)
# pins the contract structurally; this ignore prevents the linter from
# regressing it cosmetically.
"lumenairy/propagators/propagation.py" = ["F401", "F403"]
"lumenairy/raytrace/core.py" = ["F401", "F403"]
"lumenairy/propagators/asymptotic.py" = ["F401", "F403"]
"lumenairy/optimize/core.py" = ["F401", "F403"]
"lumenairy/io/prescriptions.py" = ["F401", "F403"]
"lumenairy/analysis/core.py" = ["F401", "F403"]
# Sub-package __init__.py files are also re-export hubs.
"lumenairy/optimize/__init__.py" = ["F401", "F403"]
"lumenairy/propagators/__init__.py" = ["F401", "F403"]
"lumenairy/io/__init__.py" = ["F401", "F403"]
"lumenairy/sources/__init__.py" = ["F401", "F403"]
"lumenairy/backend/__init__.py" = ["F401", "F403"]

# ---------------------------------------------------------------------------
# 2026-09-12 (audit 2026-09-11, V4/P1-3) -- the ignores that let the lint job
# become BLOCKING (``continue-on-error: false`` in unit-tests.yml).  Two
# classes, kept apart on purpose.
#
# (a) CONVENTION ignores.  ``E402`` is already ignored project-wide because
#     this library deliberately interleaves import statements with the
#     multi-line comments that explain WHY each one is placed where it is
#     (try-import-as blocks, deliberately-late registry imports, re-export
#     tiers).  ``I001`` is the same convention seen from the other side:
#     ruff's isort wants to merge those runs into one sorted block, which
#     deletes the commentary -- MEASURED on ``lumenairy/raytrace/__init__.py``,
#     where ``--fix`` relocates the whole commented ``from .exit_vertex
#     import (...)`` block.  So I001 is ignored exactly in the files that use
#     the convention, not project-wide: everywhere else import order is still
#     gated.
"lumenairy/__init__.py" = ["F401", "F403", "I001"]
"lumenairy/analysis/__init__.py" = ["F401", "F403", "I001"]
"lumenairy/elements/__init__.py" = ["F401", "F403", "I001"]
"lumenairy/raytrace/__init__.py" = ["F401", "F403", "I001"]
"lumenairy/propagators/fft_infra.py" = ["I001"]
"lumenairy/analysis/image_plane_wfe.py" = ["I001"]
#     ``E701``/``E702`` join ``I001`` for tests only: a test that writes
#     ``a = 1; b = 2`` in a parametrise table or ``if x: return`` in a tiny
#     helper is not a defect, and the shape is common in the fixture bodies
#     this suite generates per audit round.  In LIBRARY code both still fire
#     (they are only per-file-ignored for ``lumenairy/ui/``'s Qt slots).
"tests/**/*.py" = ["F401", "F811", "I001", "E701", "E702"]
#
# (b) TODO ignores -- a real finding that needs a code change in a module
#     this work package does not own.  Each is listed in
#     ``docs/audits/AUDIT_ADVERSARIAL_EXHAUSTIVE_2026_09_11/fixes/WP-A15a_REPORT.md``
#     as a request to that module's owner; when the owner lands the fix the
#     line here should be DELETED, not kept.
#     The three ``lumenairy/elements/rcwa/*`` entries that used to sit here
#     (oned.py/twod.py F401+I001, stack.py I001) are GONE: the dead
#     ``_grazing_safe_wavelength`` imports were dropped and the three
#     ``_core`` blocks re-sorted, so those files are gated like the rest.
#     The ``lumenairy/elements/_lens_real.py = ["F541"]`` entry is GONE for
#     the same reason: the two placeholder-free ``f"..."`` continuation lines
#     in the mirror-guard warning dropped their ``f`` prefix, so the file is
#     F541-gated like the rest (MEASURED: ``ruff check --isolated --select
#     F541 lumenairy/elements/_lens_real.py`` reports 0).
#     This group is now EMPTY.  Keep it that way -- a TODO ignore is a
#     deferred finding, not a convention.
#
# (c) ``lumenairy/ui/`` scoped back IN (see the ``extend-exclude`` note).
#     MEASURED 2026-09-12, ``ruff check lumenairy/ui --no-force-exclude``:
#     331 findings in exactly seven rules -- F401 121, I001 116, E701 37,
#     E702 37, F811 10, F841 7, F541 3.  All seven are cosmetic Qt idiom
#     (``from PySide6.QtWidgets import *``-style re-import blocks, one-line
#     ``if x: return``, ``a = 1; b = 2`` slot bodies), so they are ignored
#     here and the directory joins the gate for everything else.  What is now
#     ENFORCED in ~30 GUI modules that were previously unlinted: F821
#     undefined name (the exact class that shipped ``carrier_field.py:469``
#     to main this month), F632 ``is`` against a literal, F502/F522 format
#     errors, E711/E712/E713/E714 comparison bugs, E722 bare except, E731.
#     Shrink this list as the GUI is cleaned; do not grow it.
"lumenairy/ui/**/*.py" = ["F401", "I001", "E701", "E702", "F811", "F841", "F541"]

# v5.0: mypy --strict incremental adoption.  Starts with the small,
# self-contained modules per ROADMAP plan; expanding module-by-module
# in v5.1+.
#
# v5.0.1 (audit P2-NEW-V4-2): at v5.0 the strict pass produced ~63
# scope-local errors plus ~1889 cascade errors when mypy followed
# imports into untyped downstream modules (numpy, scipy, matplotlib,
# plus the un-annotated bulk of ``lumenairy/``).
# ``follow_imports = "silent"`` blocks the cascade so the gate only
# sees errors in the whitelisted files themselves.  Per-file
# overrides are NOT needed because the ``files`` whitelist below is
# explicit -- mypy will not report from any module outside it.
#
# CI STATUS, corrected 2026-09-12 (audit 2026-09-11, V4/P1-4).  The comment
# that used to sit here said "No CI wiring at v5.0.1; ``unit-tests.yml`` keeps
# mypy unwired until v5.1's cleanup lands".  That has been false since v5.2:
# ``unit-tests.yml`` has a dedicated ``mypy`` job with
# ``continue-on-error: false``, i.e. the whitelist below is a MERGE-BLOCKING
# gate, and the repo is 43 minor versions past the sentence.  The gate was
# also nearly empty -- 6 of 227 modules (2.6 %).
#
# WHITELIST GROWTH, 2026-09-12.  Rather than wait on a big-bang annotation
# cleanup, the list below was grown by MEASUREMENT, smallest first: one
# ``mypy --strict --follow-imports=silent --ignore-missing-imports
# --python-version 3.12`` pass over all 170 non-``ui`` candidate modules,
# attributing every error to the file it was reported in.  20 modules came
# back with zero errors; the 11 that are not ``__init__.py`` are added here
# (6 -> 17 checked paths).  The 9 clean ``__init__.py`` hubs are deliberately
# NOT added yet: they are being rewritten for lazy loading in the same audit
# round, and a PEP 562 ``__getattr__`` needs its own annotations before it is
# strict-clean.  Add them (and the next tranche) once that settles -- the
# measurement command is the one above.
[tool.mypy]
# 3.12, not the 3.10 runtime floor: numpy >= 2.5 ships PEP 695 `type`
# statements in its stubs, which mypy rejects below 3.12 (first hit: the
# 2026-08-16 gating run, numpy 2.5 rollout on the CI runner).  Runtime
# 3.10/3.11 compatibility is covered by the test matrix, which imports and
# runs the package on those interpreters; mypy here checks typing
# soundness, and 3.12 matches the interpreter the CI job actually runs.
python_version = "3.12"
strict = true
files = [
    "lumenairy/backend",
    "lumenairy/_deprecation.py",
    "lumenairy/_context.py",
    # v5.24.x (audit S4-20): `_validation.py` is a small, fully-annotated
    # boundary-guard module (sibling of `_deprecation` / `_context`); it
    # belongs in the strict whitelist alongside them.
    "lumenairy/_validation.py",
    "lumenairy/progress.py",
    "lumenairy/memory.py",
    # 2026-09-12 (audit V4/P1-4): measured strict-clean today, smallest first.
    # Line counts are the measurement's own sort key, kept as a reminder of
    # how far the gate reaches.
    "lumenairy/elements/coronagraph.py",      # 54 lines
    "lumenairy/raytrace/core.py",             # 68
    "lumenairy/analysis/core.py",             # 69
    "lumenairy/io/prescriptions.py",          # 106
    "lumenairy/raytrace/layout.py",           # 190
    "lumenairy/raytrace/bundles.py",          # 227
    "lumenairy/algebra/from_prescription.py", # 230
    "lumenairy/propagators/result.py",        # 244
    "lumenairy/_cache_registry.py",           # 292
    "lumenairy/analysis/strehl.py",           # 557
    "lumenairy/propagators/asymptotic_modes.py",  # 893
    # 2026-09-12 (WP-A21, from WP-A15a section 5 item 10 / WP-A15b section
    # 5.6).  The subpackage `__init__.py` files: each is a re-export surface
    # with no logic of its own, so `--strict` reaches the `__all__` / import
    # bookkeeping that a mis-spelled or removed re-export breaks -- the class
    # of defect that ships as an `ImportError` at a user's first call.  All
    # eight MEASURED strict-clean on this tree today, AFTER the lazy-loading
    # rewrite (`mypy --strict --python-version 3.12 --follow-imports silent
    # --ignore-missing-imports <path>`: 0 errors each).
    #
    # The root `lumenairy/__init__.py`, `elements/__init__.py` and
    # `elements/lens_config.py` joined once WP-A16's follow-up spelled the 31
    # lens re-exports `X as X` and annotated the PEP 562 pairs (MEASURED
    # 2026-09-12: 33 -> 0 strict errors on the root; 0 on the other two).
    "lumenairy/_math/__init__.py",
    "lumenairy/sources/__init__.py",
    "lumenairy/io/__init__.py",
    "lumenairy/analysis/__init__.py",
    "lumenairy/elements/pmm/__init__.py",
    "lumenairy/elements/rcwa/__init__.py",
    "lumenairy/elements/eme/__init__.py",
    "lumenairy/elements/bor/__init__.py",
    "lumenairy/__init__.py",
    "lumenairy/elements/__init__.py",
    "lumenairy/elements/lens_config.py",
]
# v5.0.1 (audit P2-NEW-V4-2): config preparation only -- prevents the
# ~1889-error cascade into untyped downstream files so the v5.1
# scope-local cleanup sees a clean 63-error starting baseline.
follow_imports = "silent"
# Everything else stays untyped at v5.0 (no strict checking outside the
# whitelist).  Expand the ``files`` list as modules are typed.
ignore_missing_imports = true
