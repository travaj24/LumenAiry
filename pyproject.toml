[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumenairy"
version = "5.14.6"
description = "Coherent optical beam propagation, geometric ray tracing, and manipulation using the Angular Spectrum Method."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Andrew Traverso" },
]
keywords = [
    "optics",
    "physics",
    "propagation",
    "angular-spectrum-method",
    "diffraction",
    "fourier-optics",
    "wave-optics",
    "ray-tracing",
    "photonics",
    "metasurface",
    "polarization",
    "zemax",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    # v5.0.1 (audit P3-NEW-V3-3): 3.14 dropped from classifiers --
    # the canonical CI matrix runs 3.10-3.13 and 3.14 is too new for
    # the optional accelerator dependencies (numba, jax, pyfftw) to
    # have published wheels against.  When 3.14 wheels stabilise the
    # CI matrix grows first, then the classifier returns.
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "psutil>=5.0",
]

[project.optional-dependencies]
# v5.2.2: pyfftw 0.15.1 (released 2025) bumped its
# ``requires-python`` to ``>=3.11`` while pyfftw 0.15.0 still
# supports 3.10.  pip's resolver picks 0.15.1 on 3.10 and fails the
# install entirely; cap to ``<0.15.1`` on 3.10 so 3.10 users still
# get pyfftw (last 3.10-compatible release).
fft = [
    'pyfftw>=0.13,<0.15.1; python_version < "3.11"',
    'pyfftw>=0.13; python_version >= "3.11"',
]
gpu = ["cupy>=14.0"]  # cupy.linalg.eig (cuSOLVER geev) exists only since v14
fits = ["astropy>=5.0"]
# v4.16.1 (audit M-1): refractiveindex pulled from the hard
# dependency block to align with the optional / lazy-import handling
# in ``lumenairy/glass.py``.  When this group is NOT installed the
# library transparently falls back to bundled Sellmeier coefficients
# in ``SELLMEIER_COEFFICIENTS`` for the common catalog entries; only
# tuple-style ``(shelf, book, page)`` glasses without a bundled
# Sellmeier raise a clear ImportError on first lookup.
glass = ["refractiveindex>=1.0"]
# v4.16.0: filelock is required for cross-process atomic append in
# lumenairy/io/storage.py (Agent B scope).  Filelock is a tiny pure-
# Python package (~10 KB) and is NOT a transitive dep of h5py or zarr
# (verified against h5py 3.16.0 / zarr 3.1.6), so we add it
# explicitly here.
hdf5 = ["h5py>=3.0", "filelock>=3.0"]
# v4.16.1 (audit M-3): bumped from ``zarr>=2.14`` to ``zarr>=3.0``.
# ``lumenairy/io/storage.py`` uses ``Group.create_array``, a Zarr-v3
# API.  Users pinning ``zarr==2.x`` hit ``AttributeError`` on the
# Group object; bumping the floor matches the actual API in use.
#
# v5.2.2: zarr>=3.0 itself ``requires-python = ">=3.11"`` (zarr 3.1.6
# confirmed via PyPI metadata).  ``pip install lumenairy[zarr]`` on
# Python 3.10 (the library's documented floor) hits a resolver
# conflict and fails the install entirely -- which broke the v5.1.1
# re-added 3.10 CI matrix entry.  PEP 508 environment marker pins
# the zarr line to Python >= 3.11 so the 3.10 install path
# resolves; tests requiring zarr v3 already skip cleanly when
# zarr is missing (per the v4.16.0 per-test pattern at
# ``test_v4_16_0_agent_b_multiprocess_storage.py:142-159``; the
# v5.2.2 inline comment originally cited a non-existent "conftest"
# pattern -- ``tests/conftest.py`` has no zarr handling.  v5.3
# (AUDIT_V5_2_5 V6 closure) corrects the citation).  ``filelock``
# stays unconditional so the storage-lock contract is exercisable
# on 3.10 (against h5py only) too.
zarr = ['zarr>=3.0; python_version >= "3.11"', "filelock>=3.0"]
# JAX (CPU): enables automatic differentiation of any function written
# against the array-namespace dispatch (lumenairy.backend), JIT
# compilation via XLA, and free GPU/TPU acceleration if the user
# installs jax[cuda] / jax[tpu] separately.
jax = ["jax>=0.4.20"]
# JAX with CUDA wheels.  User is responsible for ensuring a compatible
# CUDA / cuDNN install is on the system.
jax-gpu = ["jax[cuda12]>=0.4.20"]
# numexpr fuses the ``E * exp(-1j*k0*opd)`` phase-screen multiply in
# ``apply_real_lens``, ~1.7x faster at large N and substantially
# lower peak memory (no complex128 NxN intermediates).  Optional --
# library falls back to numpy when missing.
perf = ["numexpr>=2.8"]
# Numba JIT for the aspheric-coefficient sum and the Maslov Chebyshev
# evaluator.  Library falls back to NumPy paths when missing.
numba = ["numba>=0.58"]
# v4.16 (ROADMAP #11): pymoo wraps NSGA-II for multi-objective Pareto
# optimisation in ``lumenairy.optimize.multi_objective``.  Strictly
# opt-in: the wrapper module imports without pymoo (so users can
# discover the function via tab-complete / docs), and only the actual
# ``design_optimize_multi_objective(...)`` call raises ImportError if
# pymoo is missing.  pymoo's transitive deps (autograd, deap, cma)
# are heavier than the existing optional groups, so it is NOT bundled
# into the ``all`` group below.
multi_objective = ["pymoo>=0.6"]
# LumenAiry Designer GUI: PySide6 + 3D viewer + storage backend.
gui = [
    "PySide6>=6.5",
    "pyvista>=0.40",
    "pyvistaqt>=0.9",
    "h5py>=3.0",
]
all = [
    # v5.2.2: same env-marker split as the standalone ``fft`` extras
    # group -- pyfftw 0.15.1+ requires Python 3.11+.
    'pyfftw>=0.13,<0.15.1; python_version < "3.11"',
    'pyfftw>=0.13; python_version >= "3.11"',
    "numexpr>=2.8",
    "numba>=0.58",
    "astropy>=5.0",
    "h5py>=3.0",
    # v4.16.1 (audit M-3): aligned with the standalone ``zarr`` extras
    # group: floor bumped to Zarr v3 (Group.create_array API).
    # v5.2.2: zarr v3 requires Python 3.11+; env marker skips it on
    # 3.10 (storage-zarr tests skip on 3.10 in that case).
    'zarr>=3.0; python_version >= "3.11"',
    "jax>=0.4.20",
    "filelock>=3.0",
    # v4.16.1 (audit M-1): refractiveindex bundled into ``all`` so the
    # one-shot ``pip install lumenairy[all]`` continues to pull it
    # along with every other optional accelerator.
    "refractiveindex>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-benchmark>=4.0",
]

[project.urls]
Homepage = "https://github.com/travaj24/LumenAiry"
Documentation = "https://github.com/travaj24/LumenAiry/wiki"
Repository = "https://github.com/travaj24/LumenAiry.git"
Issues = "https://github.com/travaj24/LumenAiry/issues"
Changelog = "https://github.com/travaj24/LumenAiry/blob/main/CHANGELOG.md"
Releases = "https://github.com/travaj24/LumenAiry/releases"

[project.scripts]
lumenairy-designer = "lumenairy.ui.main_window:_cli_main"

# Auto-discover sub-packages (lumenairy + lumenairy.ui) instead of
# hand-listing each.  ``find:`` requires the include glob so we don't
# accidentally pick up other top-level dirs.
[tool.setuptools.packages.find]
include = ["lumenairy*"]

[tool.setuptools.package-data]
lumenairy = ["*.md", "*.txt", "*.html", "py.typed"]

[tool.pytest.ini_options]
# Two-layer test suite (4.3.0+):
#
#   tests/unit/        -- fast (<30s) API-contract tests; no external
#                          deps; default target on a fresh checkout.
#   tests/integration/ -- pytest wrapper around validation/, runs each
#                          validation/<dir>/test_*.py as a subprocess
#                          for full physics validation (~30 min).
#
# Mark integration tests with @pytest.mark.integration so they can
# be opted-in (``-m integration``) or skipped (``-m "not integration"``).
# The default invocation runs unit + (un-marked) tests and skips the
# integration suite for fast dev feedback.
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
# Allow pytest to discover both the canonical ``test_*`` naming and
# the legacy ``t_*`` naming used throughout the ``validation/`` suite
# (the latter is wrapped by ``validation/conftest.py`` so its
# ``(bool, str)`` returns are converted into real assertions).
python_functions = ["test_*", "t_*"]
markers = [
    "unit: fast API-contract tests, no external deps (<30s total)",
    "integration: full validation suite via subprocess (~30 min)",
    "regression: tests guarding against specific historical bugs",
    "slow: long-running physics simulations",
    "bench: pytest-benchmark micro-perf tests (run with --benchmark-only)",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m", "not integration",
]

# v5.0: ruff lint configuration -- minimal first-pass adoption.  Heavier
# rule sets (PT, RET, SIM, etc.) come in v5.1 once the existing code
# has been swept clean of the v5.0 baseline issues.
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "validation/",
    "docs/",
    "examples/",
    "lumenairy/ui/",  # GUI code uses different idioms; defer to v5.1
]

[tool.ruff.lint]
# Conservative initial rule set: errors only (E), pyflakes (F), import
# sorting (I).  No style nits at v5.0 to keep the diff manageable;
# additional categories opt in per-module via per-file-ignores.
select = ["E", "F", "I"]
ignore = [
    "E501",  # line too long: many legitimate long-string fail-message lines
    "E741",  # ambiguous variable name: physics symbols (l, I, O) collide
    "E402",  # module-level import not at top: lazy imports + try-import-as
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F401", "F811"]  # test files re-import + redefine fixtures freely
"lumenairy/__init__.py" = ["F401", "F403"]  # re-export hub
# v5.2 (audit P3-NEW post-v5.1.0-split closure): the 6 file-split shells
# do ``from .X import Y`` purely to re-export pre-v5.1.0 public symbols.
# Without this ignore, ``ruff --fix`` removes the unused imports and
# breaks every external ``from lumenairy.propagators.propagation import Y``
# call site that pre-v5.1.0 worked.  V13 walker (shell-vs-canonical)
# pins the contract structurally; this ignore prevents the linter from
# regressing it cosmetically.
"lumenairy/propagators/propagation.py" = ["F401", "F403"]
"lumenairy/raytrace/core.py" = ["F401", "F403"]
"lumenairy/propagators/asymptotic.py" = ["F401", "F403"]
"lumenairy/optimize/core.py" = ["F401", "F403"]
"lumenairy/io/prescriptions.py" = ["F401", "F403"]
"lumenairy/analysis/core.py" = ["F401", "F403"]
# Sub-package __init__.py files are also re-export hubs.
"lumenairy/analysis/__init__.py" = ["F401", "F403"]
"lumenairy/elements/__init__.py" = ["F401", "F403"]
"lumenairy/optimize/__init__.py" = ["F401", "F403"]
"lumenairy/propagators/__init__.py" = ["F401", "F403"]
"lumenairy/raytrace/__init__.py" = ["F401", "F403"]
"lumenairy/io/__init__.py" = ["F401", "F403"]
"lumenairy/sources/__init__.py" = ["F401", "F403"]
"lumenairy/backend/__init__.py" = ["F401", "F403"]

# v5.0: mypy --strict incremental adoption.  Starts with the small,
# self-contained modules per ROADMAP plan; expanding module-by-module
# in v5.1+.
#
# v5.0.1 (audit P2-NEW-V4-2): mypy activation deferred to v5.1
# alongside the 63-error scope-local cleanup.  At v5.0 ship the
# strict pass produced ~63 scope-local errors plus ~1889 cascade
# errors when mypy followed imports into untyped downstream modules
# (numpy, scipy, matplotlib, plus the un-annotated bulk of
# ``lumenairy/``).  ``follow_imports = "silent"`` blocks the cascade
# so a future activation only sees the 63 scope-local errors that
# the v5.1 cleanup actually owns.  Per-file overrides are NOT needed
# because the ``files`` whitelist below is already explicit (5
# modules) -- mypy will not enter any other code from outside that
# whitelist with ``follow_imports = "silent"``.  No CI wiring at
# v5.0.1; ``unit-tests.yml`` keeps mypy unwired until v5.1's cleanup
# lands.
[tool.mypy]
python_version = "3.10"
strict = true
files = [
    "lumenairy/backend",
    "lumenairy/_deprecation.py",
    "lumenairy/_context.py",
    "lumenairy/progress.py",
    "lumenairy/memory.py",
]
# v5.0.1 (audit P2-NEW-V4-2): config preparation only -- prevents the
# ~1889-error cascade into untyped downstream files so the v5.1
# scope-local cleanup sees a clean 63-error starting baseline.
follow_imports = "silent"
# Everything else stays untyped at v5.0 (no strict checking outside the
# whitelist).  Expand the ``files`` list as modules are typed.
ignore_missing_imports = true
